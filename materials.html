<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Materials to Credits</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="site-nav">
        <a href="index.html">Upgrade Path</a>

        <a href="materials.html" class="active">
            Materials → Credits
        </a>

        <a href="budget.html">
            Credit Budget
        </a>
    </nav>

    <main class="container">

        <header>
            <h1>Materials → Credits</h1>

            <p>
                Convert any amount of blocks into credits.
            </p>
        </header>

        <section class="calculator">

            <div class="field">

                <label for="materialAmount">
                    Materials
                </label>

                <input
                    id="materialAmount"
                    class="normal-input"
                    type="text"
                    placeholder="Example: 1.25b"
                    autocomplete="off"
                >

                <small>
                    Supports numbers like 500m, 1.25b or 750000000.
                </small>

            </div>

            <div class="field">

                <label for="quickBlockRate">
                    Block Rate
                </label>

                <div class="block-rate-input">

                    <input
                        id="quickBlockRate"
                        type="number"
                        value="200"
                        min="0.01"
                        step="0.01"
                    >

                    <div class="block-rate-unit">
                        <span>m</span>
                        <small>/ credit</small>
                    </div>

                </div>

                <small>
                    Millions of blocks per credit.
                </small>

            </div>

        </section>

        <section class="results quick-results">

            <div class="result-card">
                <span>Materials</span>

                <strong id="parsedMaterials">
                    0
                </strong>
            </div>

            <div class="result-card total">
                <span>Credits</span>

                <strong id="quickCredits">
                    0c
                </strong>
            </div>

        </section>

        <div
            id="materialError"
            class="warning"
        ></div>

    </main>

    <script src="materials.js"></script>

</body>

</html>
